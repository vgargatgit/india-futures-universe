[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "india-futures-universe"
version = "0.1.0"
description = "Point-in-time NSE stock-futures data producer"
requires-python = ">=3.12"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=16",
  "requests>=2.32",
  "PyYAML>=6.0",
]

[project.scripts]
india-futures-data = "india_futures_universe.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
